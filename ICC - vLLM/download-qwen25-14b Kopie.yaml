kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: vllm-pvc
  namespace: inf-vllm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 250Gi

---

apiVersion: batch/v1
kind: Job
metadata:
  name: download-qwen25-14b
  namespace: inf-vllm
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: downloader
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install --no-cache-dir "huggingface_hub[cli]" && \
              huggingface-cli download Qwen/Qwen2.5-14B-Instruct \
              --local-dir /models/Qwen2.5-14B-Instruct
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-credentials
                  key: token
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-pvc
