kind: ConfigMap
apiVersion: v1
metadata:
  name: n8n-config
  namespace: wbb822
data:
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "n8n-postgres" # Name of the Postgres service
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"
  DB_POSTGRESDB_USER: "n8n"
  DB_POSTGRESDB_PASSWORD: "ovzFrjSRBo7pL9Se"
  GENERIC_TIMEZONE: "Europe/Berlin"
  N8N_HOST: "0.0.0.0"
  N8N_PORT: "5678"
  N8N_SECURE_COOKIE: "false"

---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: n8n
  namespace: wbb822
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
        - name: n8n-container
          image: n8nio/n8n:2.7.5 # https://hub.docker.com/r/n8nio/n8n
          envFrom:
            - configMapRef:
                name: n8n-config
          ports:
            - containerPort: 5678
              protocol: TCP
          resources:
            requests:
              cpu: 2
              memory: "2Gi"
            limits:
              cpu: 2
              memory: "2Gi"

---

kind: Service
apiVersion: v1
metadata:
  name: n8n
  namespace: wbb822
spec:
  type: ClusterIP
  ports:
    - name: n8n
      port: 5678
      protocol: TCP
      targetPort: 5678
  selector:
    app: n8n
