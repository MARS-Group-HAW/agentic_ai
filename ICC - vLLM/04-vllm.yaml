kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: vllm-pvc
  namespace: wbb822
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 50Gi

---

kind: Secret
apiVersion: v1
metadata:
  name: hf-token-secret
  namespace: wbb822
type: Opaque
stringData:
  token: "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"

---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: vllm-server
  namespace: wbb822
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm-container
          image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:latest
          # Llama model is "gated", that means access from Huggingface account must be requested and approved by owner.
          #command: ["tail", "-f", "/dev/null"]
          command: ["vllm", "serve", "meta-llama/Llama-3.2-1B-Instruct", "--max-model-len", "16384", "--dtype", "float16"]
          env:
            - name: VLLM_TARGET_DEVICE
              value: "cpu"
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "8"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 8
              memory: "32Gi"
            limits:
              cpu: 8
              memory: "32Gi"
          volumeMounts:
            - name: llama-storage
              mountPath: "/root/.cache/huggingface"
      volumes:
        - name: llama-storage
          persistentVolumeClaim:
            claimName: vllm-pvc

---

kind: Service
apiVersion: v1
metadata:
  name: vllm-server
  namespace: wbb822
spec:
  type: ClusterIP
  ports:
    - name: vllm
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app: vllm
