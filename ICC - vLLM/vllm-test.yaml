apiVersion: v1
kind: Pod
metadata:
  name: vllm-test
  namespace: inf-vllm
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: curlimages/curl:latest
      command:
        - sh
        - -c
        - |
          echo "=== Test 1: DNS-Auflösung ==="
          nslookup vllm-qwen25-7b.inf-vllm.svc.cluster.local || echo "DNS FEHLGESCHLAGEN"
          echo ""
          echo "=== Test 2: Service-Liste, Modelle ==="
          curl -s -m 5 -w "\nHTTP-Status: %{http_code}\n" \
            http://vllm-qwen25-7b.inf-vllm.svc.cluster.local:8000/v1/models
          echo ""
          echo "=== Test 3: Vollständiger Inferenz-Call ==="
          curl -s -m 30 -w "\nHTTP-Status: %{http_code}\n" \
            http://vllm-qwen25-7b.inf-vllm.svc.cluster.local:8000/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model":"qwen2.5-7b","messages":[{"role":"user","content":"Sag Hallo."}],"max_tokens":20}'
          echo ""
          echo "=== Fertig ==="
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
