apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: inf-vllm
data:
  config.yaml: |
    model_list:
      - model_name: qwen2.5-7b
        litellm_params:
          model: openai/qwen2.5-7b
          # WICHTIG: HAW-Cluster nutzt 'k8s.informatik.haw-hamburg.de'
          # statt 'cluster.local' als Cluster-Domain.
          api_base: http://vllm-qwen25-7b.inf-vllm.svc.k8s.informatik.haw-hamburg.de:8000/v1
          api_key: "dummy"

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      default_max_budget: 10.0
      default_team_budget: 100.0

    litellm_settings:
      drop_params: True
      set_verbose: False
      json_logs: True

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: inf-vllm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h litellm-postgres -p 5432 -U litellm; do
                echo "Warte auf Postgres..."
                sleep 2
              done
              echo "Postgres bereit."
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm-database:main-stable
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
            - "--num_workers"
            - "1"
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-postgres
                  key: database-url
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 4000
            initialDelaySeconds: 120
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: litellm-config

---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: inf-vllm
  labels:
    app: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP

