apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-service-user
  namespace: inf-vllm
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-service-users
  namespace: inf-vllm
subjects:
  - kind: User
    name: wlk931
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: llm-service-user
  apiGroup: rbac.authorization.k8s.io
