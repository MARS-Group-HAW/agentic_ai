apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen25-7b
  namespace: inf-vllm
  labels:
    app: vllm-qwen25-7b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen25-7b
  strategy:
    type: Recreate                      # GPU exklusiv -> kein RollingUpdate
  template:
    metadata:
      labels:
        app: vllm-qwen25-7b
    spec:
      tolerations:
        # GPU-Nodes sind getaintet, damit nur GPU-Workloads dort schedulen.
        # Der Taint-Key ist cluster-spezifisch -- mit
        #   kubectl describe nodes | grep -i taint
        # verifizieren. Auf diesem Cluster: 'gpu-tesla-v100s'.
        # Vorteil dieser Konvention: Da der Taint nur auf V100S-Nodes (32 GB)
        # liegt, wird automatisch die richtige Hardware gewählt -- kein
        # zusätzlicher nodeSelector nötig.
        - key: "gpu-tesla-v100s"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.7.3
          args:
            - "--model=/models/Qwen2.5-7B-Instruct"
            - "--served-model-name=qwen2.5-7b"
            - "--dtype=half"             # FP16 statt BF16 (V100-Pflicht)
            - "--max-model-len=8192"     # konservativ wegen fehlender FlashAttn2
            - "--gpu-memory-utilization=0.90"
            - "--enable-prefix-caching"
            - "--host=0.0.0.0"
            - "--port=8000"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HUB_OFFLINE
              value: "1"                 # keine HF-Calls zur Laufzeit
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30         # bis zu 5 Min für Modell-Load
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen25-7b
  namespace: inf-vllm
  labels:
    app: vllm-qwen25-7b
spec:
  type: ClusterIP
  selector:
    app: vllm-qwen25-7b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

